# 店铺级配置 —— 阶段 2「最小可用」版
# 原则：只填够触发判断的字段，其余留空后续补。

store_id: shop_001
store_name: 示例女装店
category_scope: 服装
currency: CNY

# ---------------------------------------------------------------------------
# 发货与售前规则（对应 operating-policy.md「可自动回答」第 4 条）
# ---------------------------------------------------------------------------
shipping:
  lead_time: 48 小时内发货
  carriers: [中通快递, 圆通速递]
  free_shipping_note: 满 99 元包邮
  pre_sale_note: 预售商品以商品页标注的发货时间为准

# ---------------------------------------------------------------------------
# 固定话术
# ---------------------------------------------------------------------------
# 转人工占位回复。operating-policy.md 明确要求：
# 不得承诺处理结果、到账时间或赔偿金额。
#
# 分两类，因为「结合订单核实」不适用于商品资料缺失场景：
handoff_message: 亲，这个问题需要人工客服结合订单情况核实，我已经为您转接，请稍等～
handoff_message_generic: 亲，这个我帮您转接人工客服确认一下，请稍等～

# 尺码追问话术。用于「顾客侧信息缺失」——即顾客问了尺码但没说身高体重。
size_followup_message: 亲，麻烦告诉我一下您的身高和体重（例如 160cm / 50kg），我帮您看看这款更建议哪个码～

# 无法确定商品时的追问话术。
product_followup_message: 亲，麻烦告诉我您想咨询的是哪一款商品，我帮您看看哦～

# 寒暄应答。「你好」「在吗」这类不转人工，直接回这一条。
# 为什么单独配：转人工是负体验——顾客只是打个招呼却等来「帮您转接人工」，
# 会觉得店里没人。回一句「在的」+ 几个开口方向才是最优解。
greeting_message: |-
  亲，在的～您看中哪款了呢？
  关于尺码、面料、版型、现货颜色、发货时间，都可以直接问我。
  要是还没定款，告诉我身高体重和想要的款式，我帮您推荐～

# ---------------------------------------------------------------------------
# 尺码推荐通用对照（⚠️ 示例值，需商家核准后替换）
#
# 定位：店铺级兜底规则。当商品资料未提供专属推荐表时使用。
# 算法：按中心点距离匹配（身高权重 1.0 / 体重权重 1.0），
#      若最优与次优距离差 < 3，判定为「临界码」，回复中必须提示两码都接近。
# 措辞：只允许「更建议」「可参考」，禁止「保证合身」（operating-policy.md）。
# ---------------------------------------------------------------------------
size_guide:
  applies_to: 女装
  disclaimer: 仅供参考，最终以商品尺码表为准
  table:
    - { label: S,   height: 151, weight: 43 }
    - { label: M,   height: 157, weight: 50 }
    - { label: L,   height: 163, weight: 59 }
    - { label: XL,  height: 169, weight: 70 }
    - { label: 2XL, height: 174, weight: 85 }

# ---------------------------------------------------------------------------
# 店铺政策（⚠️ 示例值，需商家核准后替换）
#
# 定位：**不依赖商品**的店铺级咨询。顾客不点商品卡、直接问政策时靠这段答。
# 对应 operating-policy.md「可自动回答」的店铺规则类。
# ---------------------------------------------------------------------------
policies:
  return_policy: 支持七天无理由退换，商品需保持吊牌完好、未洗涤未穿着。
  invoice: 支持开具电子发票，下单时勾选即可，发货后发送到您下单的邮箱。
  authenticity: 官方直营，正品保证。

# ---------------------------------------------------------------------------
# 店铺优惠（⚠️ 示例值，需商家核准后替换）
#
# 只写公开的店铺级活动。**议价（「能便宜点吗」）不走这里，一律转人工**——
# 私下降价是事故，由人决定。
# ---------------------------------------------------------------------------
promotions:
  note: 目前店铺满 199 元减 20 元，新客首单还有 10 元无门槛券

# ---------------------------------------------------------------------------
# 兜底策略（对应 operating-policy.md「必须转人工」）
# ---------------------------------------------------------------------------
fallback:
  on_missing_product: ask_followup   # 认不出是哪款 -> 先追问；有候选则列候选让顾客点
  on_missing_product_card: handoff   # 商品卡指向的商品没入库 -> 转人工（不问顾客）
  on_missing_product_data: handoff   # 商品资料缺失 -> 转人工（不编）
  on_stock_out: handoff              # 全码无货 -> 转人工（顾客接着必问补货）
  on_bargain: handoff                # 议价让利 -> 转人工（私下降价是事故）
  on_conflict: handoff               # 资料相互冲突 -> 转人工
  on_unknown_intent: handoff         # 意图无法判断 -> 转人工
  auto_reply_enabled: true           # 总开关

data_source_note: 商品资料为构造的示例数据（sample_data=true），非真实采集所得
